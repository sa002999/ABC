  #kinu-wireframes .wire-field input[type="checkbox"] {width:18px;height:18px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--wf-strong);}
  #kinu-wireframes .wire-field.check label {min-height:44px;display:flex;align-items:center;}
  #kinu-wireframes .table-skeleton {border-top:1px solid var(--wf-line);margin-bottom:12px;}
  #kinu-wireframes .table-skeleton div {border-bottom:1px solid var(--wf-line);padding:12px 0;font-size:12px;}
  #kinu-wireframes .feedback {margin-top:16px;padding:12px;background:var(--wf-panel);border-left:3px solid var(--wf-strong);}
  #kinu-wireframes .site-footer {padding:18px 20px;border-top:1px solid var(--wf-line);display:flex;flex-wrap:wrap;gap:8px;color:var(--wf-soft);}
  #kinu-wireframes .mobile-nav {display:none;}
  #kinu-wireframes .review-notes {margin-top:16px;}
  #kinu-wireframes .review-notes summary {font-weight:500;padding:8px 0;}
  #kinu-wireframes .review-notes table {border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed;}
  #kinu-wireframes .review-notes td,#kinu-wireframes .review-notes th {border-bottom:1px solid var(--wf-line);text-align:left;padding:9px 6px;overflow-wrap:anywhere;vertical-align:top;font-weight:400;}
  #kinu-wireframes .review-notes th {font-weight:500;}
  #kinu-wireframes .device.mobile .regions .region {grid-column:span 12;}
  #kinu-wireframes .device.mobile .screen-content {padding:14px;}
  #kinu-wireframes .device.mobile .site-nav button:not(.mobile-menu) {display:none;}
  #kinu-wireframes .device.mobile .mobile-nav {display:flex;border-top:1px solid var(--wf-line);flex-wrap:wrap;padding:8px;gap:4px;}
  #kinu-wireframes .device.mobile .mobile-nav button {flex:1;min-width:48px;padding:6px 4px;font-size:12px;}
  #kinu-wireframes .device.mobile h2 {font-size:20px;}
  #kinu-wireframes .mobile-menu {display:none;}
  #kinu-wireframes .device.mobile .mobile-menu {display:block;}
  #kinu-wireframes .device.mobile .site-nav.menu-open button {display:block;}
  #kinu-wireframes [hidden] {display:none!important;}
  @media(max-width:600px) {
    #kinu-wireframes .review-toolbar {padding-right:0;}
    #kinu-wireframes .review-label {display:block;margin-left:0;}
    #kinu-wireframes .device .regions .region {grid-column:span 12!important;}
    #kinu-wireframes .screen-content {padding:14px;}
    #kinu-wireframes .site-nav {padding:10px;}
    #kinu-wireframes .site-nav button:not(.mobile-menu) {display:none;}
    #kinu-wireframes .site-nav .mobile-menu,#kinu-wireframes .site-nav.menu-open button {display:block;}
    #kinu-wireframes .mobile-nav {display:flex;gap:4px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--wf-line);}
    #kinu-wireframes .mobile-nav button {flex:1;min-width:48px;padding:6px 4px;font-size:12px;}
  }
</style>
<script>
(() => {
  const root=document.getElementById('kinu-wireframes');
  const pages=JSON.parse(root.querySelector('#wf-data').textContent);
  const byId=new Map(pages.map(p=>[p.id,p]));
  const select=root.querySelector('#wf-page');
  let current='detail', mobile=false;
  const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
  const groups=new Map();
  pages.forEach(p=>{if(!groups.has(p.group)){const group=document.createElement('optgroup');group.label=p.group;select.append(group);groups.set(p.group,group);}const option=el('option',p.name);option.value=p.id;groups.get(p.group).append(option);});
  function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{wireframePage:current,device:mobile?'mobile':'desktop'},privateContent:{version:1}}).catch(()=>{});}
  function showFeedback(text){const feedback=root.querySelector('#wf-toast');feedback.textContent='操作規格：'+text;feedback.hidden=false;}
  function button(label,target,effect,primary=false){const b=el('button',label,'cursor-interaction'+(primary?' primary':''));b.type='button';b.addEventListener('click',()=>{if(target&&byId.has(target)){current=target;render();save();}else showFeedback(effect);});return b;}
  function render(){
    const p=byId.get(current)||pages[0];current=p.id;select.value=p.id;
    const index=pages.indexOf(p);root.querySelector('#wf-count').textContent=(index+1)+' / '+pages.length+' 個頁面與狀態';
    root.querySelector('#wf-prev').disabled=index===0;root.querySelector('#wf-next').disabled=index===pages.length-1;
    root.querySelector('#wf-device').classList.toggle('mobile',mobile);
    root.querySelector('#wf-desktop').setAttribute('aria-pressed',String(!mobile));root.querySelector('#wf-mobile').setAttribute('aria-pressed',String(mobile));
    root.querySelector('#wf-route').textContent=p.route;root.querySelector('#wf-title').textContent=p.name;
    root.querySelector('#wf-access').textContent=p.group+' · '+p.access+' · '+p.phase;
    root.querySelector('#wf-goal').textContent=p.goal;root.querySelector('#wf-toast').hidden=true;
    const nav=root.querySelector('#wf-site-nav');nav.replaceChildren();nav.classList.remove('menu-open');nav.append(el('span','KINU TABI','brand'));
    const menu=button('選單','','開啟／收合主導覽');menu.classList.add('mobile-menu');menu.addEventListener('click',()=>nav.classList.toggle('menu-open'));nav.append(menu);
    const admin=p.group==='門市後台';
    const navItems=admin?[['預約','admin-bookings'],['庫存','admin-inventory'],['名額','admin-slots'],['商品','admin-catalog']]:[['探索方案','plans'],['AI 試穿','tryon'],['門市','stores'],['我的造型','looks'],['會員','account'],['立即預約','booking-store']];
    navItems.forEach(([label,target])=>nav.append(button(label,target,'',label==='立即預約')));
    const adminNav=root.querySelector('#wf-admin-nav');adminNav.hidden=!admin;adminNav.replaceChildren();
    if(admin)[['預約詳情','admin-detail'],['報到核銷','admin-checkin'],['出借歸還','admin-rentals'],['退款授權','admin-refund']].forEach(([l,t])=>adminNav.append(button(l,t,'')));
    const regions=root.querySelector('#wf-regions');regions.replaceChildren();regions.dataset.layout=p.layout;
    regions.classList.toggle('has-left',p.blocks.some(b=>b.position==='left'));regions.classList.toggle('has-right',p.blocks.some(b=>b.position==='right'));
    const positions={hero:'01 頂部／主視覺',left:'左欄 → 手機上方',main:'主要內容區',right:'右欄 → 手機主內容後',bottom:'下方／主要操作區'};
    const order=p.layout==='detail'?['hero','left','right','main','bottom']:['hero','left','main','right','bottom'];
    const ordered=[...p.blocks].sort((a,b)=>order.indexOf(a.position)-order.indexOf(b.position));
    ordered.forEach(block=>{
      const panel=el('section',undefined,'region');panel.dataset.position=block.position;
      panel.append(el('span',positions[block.position],'region-position'),el('h3',block.title));
      if(block.kind==='image'||block.kind==='cards')panel.append(el('div',block.kind==='cards'?'圖片／卡片版位':'圖片版位','image-placeholder'));
      if(block.kind==='qr')panel.append(el('div','動態 QR／掃碼區位置','qr-placeholder'));
      if(block.kind==='fields')block.lines.forEach(line=>{const f=el('div',undefined,'field');f.append(el('div',line),el('div',undefined,'field-skeleton'));panel.append(f);});
      else if(block.kind==='table'){const table=el('div',undefined,'table-skeleton');block.lines.forEach(line=>table.append(el('div',line)));panel.append(table);}
      else {const list=el('ul');block.lines.forEach(line=>list.append(el('li',line)));panel.append(list);}
      (block.controls||[]).forEach((c,index)=>{
        const field=el('div',undefined,'wire-field'+(c.type==='checkbox'?' check':''));
        const label=el('label',c.label);const id='field-'+p.id+'-'+block.position+'-'+index;label.htmlFor=id;
        let input;
        if(c.type==='select'){input=el('select');input.append(el('option','請選擇（線框位置）'));}
        else if(c.type==='textarea'){input=el('textarea');input.rows=2;input.readOnly=true;input.placeholder='內容輸入位置';}
        else if(c.type==='file'){input=el('button','選擇照片（位置示意）','cursor-interaction');input.type='button';input.addEventListener('click',()=>showFeedback('正式實作中同意後才開啟照片選取；線框不接收照片'));}
        else{input=el('input');input.type=c.type;if(c.type!=='checkbox'){input.readOnly=true;input.placeholder='輸入位置';}}
        input.id=id;
        if(c.type==='checkbox'){label.prepend(input);field.append(label);}else field.append(label,input);
        panel.append(field);
      });
      if(block.actions.length){const actions=el('div',undefined,'actions');block.actions.forEach(a=>actions.append(button(a.label,a.target,a.effect,/立即預約|以此|確認生成|確認支付|下一步|前往付款|^登入$|建立帳號|確認核銷|儲存變更|確認取消|永久刪除/.test(a.label))));panel.append(actions);}
      regions.append(panel);
    });
    const footer=root.querySelector('#wf-footer');footer.replaceChildren();[['使用流程','guide'],['FAQ','faq'],['關於','about'],['隱私','privacy'],['取消退款','cancellation'],['服務條款','terms'],['聯絡','contact']].forEach(([l,t])=>footer.append(button(l,t,'')));
    const mobileNav=root.querySelector('#wf-mobile-nav');mobileNav.replaceChildren();mobileNav.hidden=admin;
    [['首頁','home'],['方案','plans'],['試穿','tryon'],['收藏','looks'],['預約','booking-store']].forEach(([l,t])=>mobileNav.append(button(l,t,'')));
    const notes=root.querySelector('#wf-notes');notes.replaceChildren();
    notes.append(el('p','依據：'+p.source));
    const rules=el('ul');p.rules.forEach(r=>rules.append(el('li',r)));notes.append(rules);
    const table=el('table');const head=el('tr');['按鈕','位置','作用／去向'].forEach(t=>head.append(el('th',t)));table.append(head);
    p.blocks.forEach(b=>b.actions.forEach(a=>{const tr=el('tr');[a.label,b.title,a.effect+(a.target?' → '+byId.get(a.target).name:'')].forEach(t=>tr.append(el('td',t)));table.append(tr);}));notes.append(table);
    notes.append(el('p','API：'+(p.api.join('；')||'靜態內容，無須為閱讀行為另增 API')));
  }
  select.addEventListener('change',()=>{current=select.value;render();save();});
  root.querySelector('#wf-prev').addEventListener('click',()=>{const i=pages.findIndex(p=>p.id===current);if(i>0){current=pages[i-1].id;render();save();}});
  root.querySelector('#wf-next').addEventListener('click',()=>{const i=pages.findIndex(p=>p.id===current);if(i<pages.length-1){current=pages[i+1].id;render();save();}});
  root.querySelector('#wf-desktop').addEventListener('click',()=>{mobile=false;render();save();});
  root.querySelector('#wf-mobile').addEventListener('click',()=>{mobile=true;render();save();});
  function restore(state){const s=state?.modelContent;if(s&&byId.has(s.wireframePage))current=s.wireframePage;if(s?.device)mobile=s.device==='mobile';render();}
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
})();
</script>

  </div>
</body>
</html>
